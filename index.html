<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alden Vaelon III</title>
<meta name="theme-color" content="#294778">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a single-column field ledger under a heraldic header; tabs live in a bar pinned to the bottom like a soldier's kit roll. */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#e2e6ec; --ink:#1b2130; --muted:#5a6476; --line:#d3d9e2;
  --gold:#a8730f; --gold-soft:#f3e6c8; --blue:#294778; --blue-soft:#dde5f2; --danger:#a5322c; --good:#2e7650;
  --display:"Marcellus SC","Cormorant SC",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#19202a; --sunk:#0c1016; --ink:#e5e8ee; --muted:#98a2b3; --line:#2a3240;
  --gold:#e3b04f; --gold-soft:#3a2f17; --blue:#94b3e6; --blue-soft:#1e2a40; --danger:#e57f76; --good:#6fc496; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#19202a; --sunk:#0c1016; --ink:#e5e8ee; --muted:#98a2b3; --line:#2a3240;
  --gold:#e3b04f; --gold-soft:#3a2f17; --blue:#94b3e6; --blue-soft:#1e2a40; --danger:#e57f76; --good:#6fc496; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h2{font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.08em;margin:0;color:var(--blue);text-wrap:balance}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* Header */
header{padding-block:22px 14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.crest{width:54px;height:66px}
.who h1{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.05;margin:0;text-wrap:balance}
.who .sub{color:var(--muted);font-size:.9rem}
.who .title{font-style:italic;color:var(--gold);font-size:.88rem;margin-top:2px}
.status{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.82rem}
.chip.conc{border-color:var(--gold);background:var(--gold-soft)}
.chip button{border:0;background:none;padding:0 0 0 4px;color:var(--muted)}
.save-state{font-size:.75rem;color:var(--muted);margin-left:auto}

section{display:grid;gap:12px;margin-bottom:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* HP */
.hp{display:grid;gap:12px}
.hp-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hp-big{font-family:var(--mono);font-size:2.6rem;font-weight:600;line-height:1}
.hp-max{color:var(--muted);font-family:var(--mono)}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--good);transition:width .25s}
.bar i.low{background:var(--gold)} .bar i.crit{background:var(--danger)}
.bar b{position:absolute;top:0;bottom:0;background:var(--blue);opacity:.55}
.hp-ctl{display:grid;grid-template-columns:1fr auto auto auto;gap:8px}
input[type=number],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
textarea{min-height:110px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500}
.btn.dmg{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.heal{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.stat .v{font-family:var(--mono);font-size:1.35rem;font-weight:600}
.stat button.v{border:0;background:none;width:100%}

/* pips */
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--gold);background:var(--gold);padding:0}
.pip.spent{background:transparent;border-color:var(--line)}
.pip.blue{border-color:var(--blue);background:var(--blue)} .pip.blue.spent{background:transparent;border-color:var(--line)}
.pip.f{border-color:var(--danger);background:transparent} .pip.f.on{background:var(--danger)}
.pip.s{border-color:var(--good);background:transparent} .pip.s.on{background:var(--good)}
.track{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.track .name{font-weight:500}
.track .hint{grid-column:1/-1;font-size:.85rem;color:var(--muted);margin-top:-4px}

/* attacks */
.atk{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.atk:first-of-type{border-top:0}
.atk .meta{font-size:.82rem;color:var(--muted)}

/* roll mode */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:.85rem}
.seg button[aria-pressed=true]{background:var(--blue);color:var(--surface)}

/* log */
.log{display:grid;gap:4px;max-height:220px;overflow:auto;font-size:.88rem}
.log div{display:flex;gap:8px;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.log .t{font-family:var(--mono);font-weight:600}

/* abilities */
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.abil{grid-template-columns:repeat(6,1fr)}}
.ab{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;display:grid;gap:4px}
.ab .score{font-family:var(--mono);font-size:1.3rem;font-weight:600}
.ab button{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:2px 0;font-family:var(--mono);font-size:.85rem}
.ab button.prof{border-color:var(--gold);color:var(--gold)}
.skills{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:560px){.skills{grid-template-columns:1fr 1fr;column-gap:20px}}
.sk{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dot.p{background:var(--gold);border-color:var(--gold)}
.sk .ab3{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.sk .m{font-family:var(--mono);font-weight:600;min-width:2.4em;text-align:right}

/* spells */
.slots{display:grid;gap:10px}
.spell-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.lvl-title{display:flex;gap:8px;align-items:baseline;width:100%;margin:8px 0 0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left}
.lvl-title[aria-expanded=true]{margin-bottom:-6px}
.lvl-title .chev{color:var(--muted);width:1em}
.lvl-title .cnt{margin-left:auto;font-size:.88rem;font-weight:600;color:var(--gold);text-align:right}
.lvl-title .cnt .sub{font-weight:400;color:var(--muted)}
.sp{border-top:1px solid var(--line);padding:9px 0;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start}
.star{border:0;background:none;font-size:1.15rem;line-height:1;padding:2px;color:var(--line)}
.star.on{color:var(--gold)}
.star.fixed{color:var(--blue);cursor:default}
.sp .nm{font-weight:700}
.sp .tags{display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 5px}
.tag.c{border-color:var(--gold);color:var(--gold)}
.tag.r{border-color:var(--blue);color:var(--blue)}
.sp .desc{grid-column:2/-1;font-size:.88rem;color:var(--muted)}
.cast{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

/* gear */
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.coin{text-align:center}
.coin input{text-align:center;font-family:var(--mono);padding:7px 2px}
.inv{display:grid;gap:0}
.it{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty span{font-family:var(--mono);min-width:2ch;text-align:center}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:0}
.it .x{border:0;background:none;color:var(--muted);padding:0 4px}

.lore p{margin:.4em 0;max-width:65ch}
.feat{border-top:1px solid var(--line);padding:9px 0}
.feat b{display:block}
.feat span{font-size:.9rem;color:var(--muted)}

/* actions + features */
.ac{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.ac:first-child{border-top:0}
.ac.off{opacity:.55}
.ac .nm{font-weight:700}
.ac .line{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);align-items:baseline}
.ac .line b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.ac .note{grid-column:1/-1;font-size:.86rem;color:var(--muted);max-width:65ch}
.ac .btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.st{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.st.ok{color:var(--good);border-color:var(--good)}
.st.pas{color:var(--blue);border-color:var(--blue)}
.econ{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
details.fe{border-top:1px solid var(--line)}
details.fe:first-of-type{border-top:0}
details.fe summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:11px 0}
details.fe summary::-webkit-details-marker{display:none}
details.fe summary .chev{color:var(--muted);transition:transform .15s}
details.fe[open] summary .chev{transform:rotate(90deg)}
details.fe summary .nm{font-weight:700;display:block}
details.fe summary .ty{font-size:.78rem;color:var(--muted)}
details.fe .body{padding:0 0 14px 22px;display:grid;gap:8px;font-size:.93rem;max-width:68ch}
details.fe .body p{margin:0}
details.fe .you{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:.88rem}
details.fe .you b{color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:2px}
details.fe .ref{font-size:.75rem;color:var(--muted)}
.fsum{display:flex;gap:8px;flex-wrap:wrap}
/* tabbar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav button{border:0;background:none;padding:6px 0;border-radius:8px;font-size:.72rem;min-width:0;display:grid;justify-items:center;gap:2px;color:var(--muted)}
nav button svg{width:22px;height:22px}
nav button[aria-current=true]{color:var(--blue);background:var(--blue-soft)}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;min-width:200px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgb(0 0 0 / .25)}
#toast .big{font-family:var(--mono);font-size:1.8rem;font-weight:600;display:block}
#toast .crit{color:var(--gold)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n+1;};
function roll(expr,crit=false){
  let total=0,parts=[];
  expr.replace(/\s/g,"").split(/(?=[+-])/).forEach(term=>{
    const sign=term[0]==="-"?-1:1, t=term.replace(/^[+-]/,"");
    const m=t.match(/^(\d*)d(\d+)$/);
    if(m){let c=(+m[1]||1)*(crit?2:1);const rs=[];for(let i=0;i<c;i++)rs.push(rnd(+m[2]));total+=sign*rs.reduce((a,b)=>a+b,0);parts.push("["+rs.join(",")+"]");}
    else if(t){total+=sign*(+t);parts.push((sign<0?"−":"+")+t);}
  });
  return {total,detail:parts.join(" ")};
}
function d20(mod){
  const a=rnd(20),b=rnd(20);
  const nat=mode==="a"?Math.max(a,b):mode==="d"?Math.min(a,b):a;
  const shown=mode==="n"?String(a):`${a}, ${b} → ${nat}`;
  return {nat,total:nat+mod,detail:`d20 (${shown}) ${mod<0?"−":"+"} ${Math.abs(mod)}`};
}
function log(label,total,detail,crit){
  S.log.unshift({l:label,t:total,d:detail});S.log=S.log.slice(0,30);save();
  const el=document.getElementById("toast");
  el.innerHTML=`<div>${esc(label)}</div><span class="big ${crit?"crit":""}">${total}</span><small>${esc(detail)}</small>`;
  el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,3200);
  if(tab==="combat") renderLogOnly();
}
function check(label,mod){const r=d20(mod);log(label,r.total,r.detail+(r.nat===20?" · natural 20":r.nat===1?" · natural 1":""),r.nat===20);}
function attack(name,hit,dmg,type,weapon){
  const r=d20(hit),crit=r.nat===20;
  let d=/d/.test(dmg)?roll(dmg,crit):{total:+dmg,detail:dmg};
  if(false&&weapon&&/d/.test(dmg)){ // Savage Attacker (not on Alden's build: 2014 Soldier background): roll the weapon's damage dice twice, keep either (once per turn; Alden only makes one weapon attack per turn)
    const d2=roll(dmg,crit), best=d2.total>d.total?d2:d, other=best===d2?d:d2;
    d={total:best.total,detail:`${best.detail} (Savage Attacker, other roll ${other.total})`};
  }
  log(`${name}: ${r.total} to hit${crit?" · CRIT":r.nat===1?" · miss":""}`,d.total+" "+type,`${r.detail} | dmg ${d.detail}`,crit);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function castSpell(i,lvl){
  const sp=SPELLS[i],[name,base,,,,,,conc]=sp,R=sp[11];
  if(lvl==="mi"){S.miCure=true;}else if(lvl>0){if(S.slots[lvl]<1)return;S.slots[lvl]--;}

  if(name==="Aid"){S.aid=5*(1+up);S.hp+=S.aid;}
  if(R?.heal){let e=R.heal;for(let k=0;k<up;k++)e+="+"+R.up;e+="+"+WIS;const r=roll(e);const dis=lvl==="mi"?0:2+L;log(`${name} (${lvl==="mi"?"free, Magic Initiate":"level "+L})`,r.total+dis+" HP",r.detail+(dis?` + ${dis} Disciple of Life`:""));}

  else if(R?.dmg){let e=R.dmg;for(let k=0;k<up;k++)e+="+"+R.up;const d=roll(e);let msg=d.detail;if(R.alt){let e2=R.alt;for(let k=0;k<up;k++)e2+="+"+R.up;const b=roll(e2);msg+=` · ${name==="Toll the Dead"?"if hurt":"vs Fiend/Undead"}: ${b.total} ${b.detail}`;}log(`${name} (DC ${DC})`,d.total+" "+R.type,msg);}

}

function actAvail(o){
  if(o.av)return o.av();
  if(o.spell){const s=SPELLS[SI(o.spell)];if(!prepd(o.spell))return null;
    if(s[1]===0)return[true,"At will"];
    const left=[1,2].filter(l=>l>=s[1]).reduce((a,l)=>a+S.slots[l],0);
    return left?[true,left+" slot"+(left>1?"s":"")]:[false,"No slots"];}
  if(o.cd)return S.cd?[true,S.cd+" of 2 left"]:[false,"None left"];
  if(o.needConc)return S.conc===o.needConc?[true,"Active"]:[false,"Cast it first"];
  return[true,"At will"];
}

function autoSpellRows(){
  const used=new Set(ACTS.filter(o=>o.spell).map(o=>o.spell));
  return SPELLS.map((s,i)=>[s,i]).filter(([s])=>prepd(s[0])&&!used.has(s[0])).map(([s,i])=>{
    const [n,lv,src,sa,t,rng,dur,c,r,dom,desc,R]=s;
    const time=t==="1A"?"Action":t==="1BA"?"Bonus action":"Takes "+t.replace("m"," min").replace("h"," hour");
    const cost=lv===0?"cantrip":lv===1?"1st slot":"2nd slot";
    const cat=t==="1BA"?"b":(R?.heal||SUPPORT.has(n))?"h":"u";
    const val=R?.heal?`${R.heal}+${WIS}${lv>0?` (+${2+lv} Disciple)`:""}`:R?.dmg?`${R.dmg} ${R.type}`:"";
    return {cat,n,spell:n,econ:[time,cost,c?"Conc":"",r?"Ritual":""].filter(Boolean).join(" · "),stat:sa!=="—"?sa:(R?.heal?"Heal":""),val,rng:rng+(dur&&dur!=="Instant"?" · "+dur:""),note:desc||"See the Spells tab for details.",auto:i};
  });
}

function vActions(){
  const ALL=[...ACTS.map((o,i)=>[o,i]),...autoSpellRows().map(o=>[o,-1])];
  let h=`<section><div class="row" style="justify-content:space-between"><span class="label">Prepared spells only</span>
    <div class="seg" role="group" aria-label="Roll mode">${[["n","Normal"],["a","Adv"],["d","Dis"]].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div></div>`;
  for(const [k,label] of ACAT){
    const rows=ALL.map(([o,i])=>[o,i,actAvail(o)]).filter(([o,,a])=>o.cat===k&&a);
    if(!rows.length)continue;
    const ready=rows.filter(([,,a])=>a[0]).length, shut=ACOL.includes(k);
    h+=`<div><button class="lvl-title" data-act="acol" data-k="${k}" aria-expanded="${!shut}"><span class="chev" aria-hidden="true">${shut?"▸":"▾"}</span><h2>${label}</h2><span class="cnt">${ready} of ${rows.length} available</span></button>`;
    if(!shut){
      h+=`<div class="panel" style="padding-block:4px;margin-top:6px">`+rows.map(([o,i,[ok,st]])=>{
        let btn="";
        if(o.btn)btn=o.btn(ok);
        else if(o.spell)btn=castCtl(SI(o.spell));
        else if(o.act)btn=`<button class="btn sm gold" data-act="${o.act}" ${ok?"":"disabled"}>Use</button>`;
        else if(o.roll)btn=`<button class="btn sm gold" data-act="atkx" data-i="${i}" ${ok?"":"disabled"}>Roll</button>`+(o.roll2?`<button class="btn sm" data-act="atkx" data-i="${i}" data-v="2">${o.roll2.label}</button>`:"");
        return `<div class="ac ${ok?"":"off"}"><div><div class="nm">${esc(o.n)} <span class="st ${ok?"ok":""}">${st}</span></div>
          <div class="line"><span class="econ">${o.econ}</span>${o.stat?`<b>${o.stat}</b>`:""}${o.val?`<span>${o.val}</span>`:""}${o.rng?`<span>${o.rng}</span>`:""}</div></div>
          <div class="btns">${btn}</div><div class="note">${esc(o.note)}</div></div>`;
      }).join("")+`</div>`;
    }
    h+=`</div>`;
  }
  return h+`</section>`;
}

 {g:"Life Domain",n:"Preserve Life",ty:"Action (Magic) · Channel Divinity",use:"cd",act:"cdpreserve",ref:"PHB-2024 73",txt:"As a Magic Action, you can expend a use of your Channel Divinity to restore 20 HP to Bloodied creatures within 30 ft. of yourself (which can include you), and divide the HP among them. This feature can only restore a creature up to half its maximum HP.",you:"Bloodied means at or below half its maximum HP. This is your best emergency heal when several allies are low."},
 {g:"Life Domain",n:"Life Domain Spells",ty:"Always on",ref:"PHB-2024 73",txt:"When you reach a Cleric level specified in the Domain Spells table, you always have the listed spells prepared.",you:"Always prepared: Bless, Cure Wounds, Aid and Lesser Restoration. They don't count towards your 7. At Cleric 5 you add Mass Healing Word and Revivify."},
 {g:"Human",n:"Resourceful",ty:"Heroic Inspiration",use:"insp",act:"insp",ref:"PHB-2024 194",txt:"You gain Heroic Inspiration whenever you finish a Long Rest. Spend it to reroll any one die immediately after you roll it. You must use the new roll.",you:"Works on any die: an attack, a save, damage, or a healing roll."},
 {g:"Human",n:"Skillful",ty:"Always on",ref:"PHB-2024 193",txt:"You gain proficiency in one skill of your choice.",you:"Your proficient skills are Athletics, Insight, Intimidation, Medicine and Religion."},
 {g:"Human",n:"Versatile",ty:"Always on",ref:"PHB-2024 194",txt:"You gain an Origin feat of your choice.",you:"You took Magic Initiate (Cleric)."},
 {g:"Human",n:"Ability Score Increases",ty:"+2 / +1",ref:"PHB-2024",txt:"When determining your character's ability scores, increase one score by 2 and a different one by 1, or increase three scores by 1. None of these can raise a score above 20. With a 2014 background, D&D Beyond attaches this to your species, because older backgrounds don't include ability increases.",you:"You chose Wisdom and Strength. Wisdom 17 + 1 = 18 (+4). Final scores: STR 20, DEX 13, CON 16, INT 11, WIS 18, CHA 9."},
 {g:"Background",n:"Soldier (2014)",ty:"Background",ref:"PHB-2014",txt:"Skill proficiencies in Athletics and Intimidation. Tool proficiencies in one gaming set and vehicles (land). Military Rank: you hold a rank from your soldiering career. Soldiers loyal to your former military organisation still recognise your authority and influence, and defer to you if they are of a lower rank. You can invoke your rank to influence other soldiers and temporarily requisition simple equipment or horses. You can usually gain access to friendly military encampments and fortresses where your rank is recognised.",you:"Athletics +7, Intimidation +1, Dice Set and Vehicles (Land). This older background has no Origin feat, so you don't get Savage Attacker. As a war veteran and Lord of House Harrowmont, Military Rank is worth bringing up with Castorian soldiers."},
 {g:"Human",n:"Creature Type, Size and Speed",ty:"Always on",ref:"PHB-2024 194",txt:"You're a Humanoid. Your size is Medium or Small, chosen when you select this species. Your Speed is 30 ft.",you:"Medium Humanoid, 30 ft walking speed."},
 {g:"Feats",n:"Magic Initiate (Cleric)",ty:"1 free cast / long rest",use:"mi",ref:"PHB-2024 201",txt:"Two Cantrips: you learn two cantrips of your choice from the Cleric spell list. Level 1 Spell: choose a level 1 Cleric spell. You always have it prepared, can cast it once without a spell slot, and regain that free cast when you finish a Long Rest. You can also cast it with any spell slots you have. Whenever you gain a level, you can swap one of these spells for another of the same level from the same list.",you:"Cantrips: Word of Radiance and Spare the Dying. Spell: Cure Wounds, free once per long rest. Disciple of Life doesn't add to the free cast because it uses no slot."},
 {g:"Feats",n:"Alert",ty:"Always on · initiative",ref:"PHB-2024 200",txt:"Initiative Proficiency: when you roll initiative, add your Proficiency Bonus to the roll. Initiative Swap: immediately after you roll initiative, you can swap your initiative with one willing ally in the same combat. You can't swap with an ally who is Incapacitated.",you:"Initiative +3 (DEX +1, proficiency +2). Use the swap to let a fast ally act early, or to go first yourself and cast Bless before anyone moves."},
];
let openF=new Set();
function featState(f){
  if(f.use==="cd")return S.cd?["ok",S.cd+" of 2 left"]:["",  "None left"];
  if(f.use==="insp")return S.insp?["ok","Ready"]:["","Used"];
  if(f.use==="mi")return S.miCure?["","Used"]:["ok","Ready"];
  return["pas","Always on"];
}
function featBtn(f){
  if(f.act==="insp")return `<button class="btn sm ${S.insp?"gold":""}" data-act="insp">${S.insp?"Spend Heroic Inspiration":"Regain Heroic Inspiration"}</button>`;
  if(f.act)return `<button class="btn sm gold" data-act="${f.act}" ${S.cd?"":"disabled"}>Use ${esc(f.n)}</button>`;
  if(f.use==="mi")return `<button class="btn sm gold" data-act="cast" data-i="${SI("Cure Wounds")}" data-l="mi" ${S.miCure?"disabled":""}>Cast free Cure Wounds</button>`;
  return "";
}
function vFeatures(){
  const usable=FEATS.filter(f=>f.use), ready=usable.filter(f=>featState(f)[0]==="ok").length;
  let h=`<section><div class="fsum"><span class="chip">Channel Divinity <b class="num">${S.cd}/2</b></span><span class="chip">Heroic Inspiration <b>${S.insp?"Ready":"Used"}</b></span><span class="chip">Free Cure Wounds <b>${S.miCure?"Used":"Ready"}</b></span></div>
  <p class="label" style="text-transform:none;letter-spacing:0;margin:0">Tap a feature to see exactly what it does.</p>`;
  for(const g of [...new Set(FEATS.map(f=>f.g))]){
    h+=`<div class="panel" style="padding-block:6px 4px"><h2 style="margin:8px 0 2px">${g}</h2>`+FEATS.map((f,i)=>[f,i]).filter(([f])=>f.g===g).map(([f,i])=>{
      const [c,st]=featState(f), b=featBtn(f);
      return `<details class="fe" data-f="${i}" ${openF.has(i)?"open":""}><summary><span class="chev" aria-hidden="true">▸</span><span><span class="nm">${esc(f.n)}</span><span class="ty">${esc(f.ty)}</span></span><span class="st ${c}">${st}</span></summary>
        <div class="body"><p>${esc(f.txt)}</p><div class="you"><b>For Alden</b>${esc(f.you)}</div>${b?`<div class="row">${b}</div>`:""}<span class="ref">${esc(f.ref)}</span></div></details>`;
    }).join("")+`</div>`;
  }
  return h+vLore()+`</section>`;
}
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches?.("details.fe")){const i=+d.dataset.f;d.open?openF.add(i):openF.delete(i);}},true);

function vLore(){
  return `<div class="lore">
  <div class="panel"><h2>Sir Alden Vaelon the Third</h2>
    <p>A seasoned fighter drafted into the Blight War, who stood for the honour of Castoria and has seen a great deal of suffering. The crown gave him the Harrowmont estate in thanks for his service. He gave almost all of it up when his wife and daughter died.</p>
    <p>He hates his official title. He walked east into the mountains to clear his head and leave the city behind, and found refuge in a church. When the local priest fell fatally ill, Alden ended up leading the congregation and caring for the townsfolk.</p>
    <p>He was not a religious man and does not feel worthy of the role, but someone had to take it up. Perhaps it is penance for years of killing. Over time his resolve has softened, and he has found truth in the holy texts he had to consult when people came to him with questions.</p>
    <p class="label" style="text-transform:none;letter-spacing:0">Open threads from the sheet: where he's from, which town the church is in (Coldheath or a nearby village?), and whether he multiclasses into Fighter.</p></div>
  </div>`;
}

function render(){
  renderTabs();renderStatus();
  const v=document.getElementById("view");
  v.innerHTML=({combat:vCombat,actions:vActions,spells:vSpells,features:vFeatures,abilities:vAbilities,gear:vGear}[tab]||vCombat)();
  if(tab==="combat")renderLogOnly();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-mode],[data-act]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;try{localStorage.setItem("alden-tab",tab)}catch(e){};render();scrollTo(0,0);return;}
  if(t.dataset.mode){mode=t.dataset.mode;render();return;}
  const a=t.dataset.act,i=+t.dataset.i,amt=()=>+document.getElementById("hpAmt").value;
  switch(a){
    case"dmg":damage(amt());break;
    case"heal":heal(amt());break;
    case"temp":{const n=amt();if(n>0){S.temp=Math.max(S.temp,n);save();render();}break;}
    case"init":check("Initiative",3);break;
    case"atk":{const x=ATTACKS[i];attack(x.n,x.hit,x.dmg,x.type,true);break;}
    case"chk":check(t.dataset.n,+t.dataset.m);break;
    case"cd":S.cd=i<S.cd?i:i+1;save();render();break;
    case"insp":S.insp=!S.insp;save();render();break;
    case"hdpip":S.hd=i<S.hd?i:i+1;save();render();break;
    case"hd":spendHD();break;
    case"cdspark":if(S.cd>0){S.cd--;const r=roll("1d8+4");save();render();log("Divine Spark (heal or CON 14 for half)",r.total,r.detail);}break;
    case"cdpreserve":if(S.cd>0){S.cd--;save();render();toastMsg("Preserve Life: share 20 HP among Bloodied allies within 30 ft.");}break;
    case"cdturn":if(S.cd>0){S.cd--;save();render();toastMsg("Turn Undead: undead within 30 ft make a WIS 14 save.");}break;
    case"short":case"long":pendingRest=a;render();break;
    case"restno":pendingRest=null;render();break;
    case"restyes":{const r=pendingRest;pendingRest=null;r==="long"?longRest():shortRest();break;}
    case"dss":S.ds.s=i<S.ds.s?i:i+1;save();render();break;
    case"dsf":S.ds.f=i<S.ds.f?i:i+1;save();render();break;
    case"deathroll":{const n=rnd(20);if(n===20){S.hp=1;S.ds={s:0,f:0};}else if(n===1)S.ds.f=Math.min(3,S.ds.f+2);else if(n>=10)S.ds.s=Math.min(3,S.ds.s+1);else S.ds.f=Math.min(3,S.ds.f+1);save();render();log("Death save",n,n===20?"Natural 20: back up at 1 HP":n===1?"Natural 1: two failures":n>=10?"Success":"Failure",n===20);break;}
    case"clearlog":S.log=[];save();renderLogOnly();render();break;
    case"dropconc":S.conc=null;save();render();break;
    case"slot1":S.slots[1]=i<S.slots[1]?i:i+1;save();render();break;
    case"slot2":S.slots[2]=i<S.slots[2]?i:i+1;save();render();break;
    case"mi":S.miCure=!S.miCure;save();render();break;
    case"prep":{const n=t.dataset.n,k=S.prepared.indexOf(n);if(k>=0)S.prepared.splice(k,1);else if(S.prepared.length<PREP_MAX)S.prepared.push(n);else{toastMsg(`You can prepare ${PREP_MAX}. Unprepare one first.`);break;}save();render();break;}
    case"col":{const k=COL.indexOf(i);k>=0?COL.splice(k,1):COL.push(i);try{localStorage.setItem("alden-col",JSON.stringify(COL))}catch(e){};render();break;}
    case"acol":{const k=t.dataset.k,j=ACOL.indexOf(k);j>=0?ACOL.splice(j,1):ACOL.push(k);try{localStorage.setItem("alden-acol",JSON.stringify(ACOL))}catch(e){};render();break;}
    case"atkx":{const o=ACTS[i],r=t.dataset.v==="2"?o.roll2:o.roll;attack(o.n+(t.dataset.v==="2"?" (two-handed)":""),r.hit,r.dmg,r.type,!!o.weapon);break;}
    case"prepfilter":window._pf=!window._pf;render();break;
    case"castopen":castOpen=i;render();break;
    case"castclose":castOpen=null;render();break;
    case"cast":{const l=t.dataset.l;castSpell(i,l==="mi"?"mi":+l);break;}
    case"qp":S.inv[i].q++;save();render();break;
    case"qm":S.inv[i].q=Math.max(0,S.inv[i].q-1);save();render();break;
    case"qx":S.inv.splice(i,1);save();render();break;
    case"additem":{const el=document.getElementById("newItem"),v=el.value.trim();if(v){S.inv.push({n:v,q:1});save();render();}break;}
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="notes"){S.notes=e.target.value;save();}
  if(e.target.dataset.coin){S.coins[e.target.dataset.coin]=Math.max(0,+e.target.value||0);save();}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="newItem")document.querySelector('[data-act="additem"]').click();});
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
